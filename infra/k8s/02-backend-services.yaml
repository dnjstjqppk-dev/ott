apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: netflix-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: netflix-registry.internal/api-gateway:latest
          env:
            - name: GATEWAY_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: IAM_GRPC_ADDR
              value: "user-profile-svc:50051"
            - name: CATALOG_GRPC_ADDR
              value: "catalog-svc:50052"
            - name: BILLING_GRPC_ADDR
              value: "billing-svc:50053"
            - name: PLAYBACK_GRPC_ADDR
              value: "playback-svc:50054"
            - name: RECO_GRPC_ADDR
              value: "reco-qc-engine:50056"
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: netflix-prod
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-svc
  namespace: netflix-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-profile-svc
  template:
    metadata:
      labels:
        app: user-profile-svc
    spec:
      containers:
        - name: iam
          image: netflix-registry.internal/user-profile-svc:latest
          env:
            - name: IAM_GRPC_ADDR
              value: "0.0.0.0:50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netflix-cluster-secrets
                  key: DATABASE_URL
            - name: JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: netflix-cluster-secrets
                  key: JWT_HMAC_SECRET
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-svc
  namespace: netflix-prod
spec:
  ports:
    - port: 50051
      targetPort: 50051
  selector:
    app: user-profile-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playback-svc
  namespace: netflix-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: playback-svc
  template:
    metadata:
      labels:
        app: playback-svc
    spec:
      containers:
        - name: playback
          image: netflix-registry.internal/playback-svc:latest
          env:
            - name: PLAYBACK_GRPC_ADDR
              value: "0.0.0.0:50054"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netflix-cluster-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis.netflix-prod.svc.cluster.local:6379/0"
          ports:
            - containerPort: 50054
---
apiVersion: v1
kind: Service
metadata:
  name: playback-svc
  namespace: netflix-prod
spec:
  ports:
    - port: 50054
      targetPort: 50054
  selector:
    app: playback-svc

