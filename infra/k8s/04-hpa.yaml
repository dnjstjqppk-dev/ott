apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: netflix-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: playback-svc-hpa
  namespace: netflix-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: playback-svc
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: open-connect-edge-hpa
  namespace: netflix-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: open-connect-edge
  minReplicas: 10
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: bandwidth
        target:
          type: Utilization
          averageUtilization: 80

